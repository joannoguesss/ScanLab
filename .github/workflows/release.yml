# Compila los instaladores al crear una etiqueta vX.Y.Z y los publica
# como release de GitHub. Ejemplo:
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Compilar ScanLab.exe
        run: pyinstaller --noconfirm --clean --windowed --name ScanLab --icon packaging\icons\ScanLab.ico --add-data "packaging\icons\ScanLab_1024.png;." --collect-all twain launcher.py
      - name: Crear instalador (Inno Setup)
        run: iscc packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ScanLab-Setup-Windows
          path: packaging/windows/Output/ScanLab-Setup.exe

  # Molts drivers TWAIN d'escàners antics (com el V500) només són de 32 bits:
  # un ScanLab de 64 bits no els pot carregar. Publiquem també la versió x86.
  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Compilar ScanLab.exe (32 bits)
        run: pyinstaller --noconfirm --clean --windowed --name ScanLab --icon packaging\icons\ScanLab.ico --add-data "packaging\icons\ScanLab_1024.png;." --collect-all twain launcher.py
      - name: Crear instalador (Inno Setup)
        run: iscc /DX86 /F"ScanLab-Setup-x86" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ScanLab-Setup-Windows-x86
          path: packaging/windows/Output/ScanLab-Setup-x86.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar .app y DMG
        run: sh packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ScanLab-macOS
          path: dist/ScanLab.dmg

  release:
    needs: [windows, windows-x86, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ScanLab-Setup.exe
            ScanLab-Setup-x86.exe
            ScanLab.dmg
